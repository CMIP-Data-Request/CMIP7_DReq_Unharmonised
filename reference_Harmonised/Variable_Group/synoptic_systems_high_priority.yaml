Name: synoptic_systems_high_priority
Title: Variables for analysis of synoptic systems and their impacts
Priority Level: High
Justification: The proposed high frequency variables are suggested to allow for standard
  feature tracking algorithms to be used to detect tropical cyclones, extratropical
  cyclones, blocking events, monsoon depressions, the MJO, and atmospheric rivers
  as well as to diagnose their surface impacts and the cloud radiative effects associated
  with them.

Name: ocean_mesoscale
Title: Variables necessary to describe the role of ocean mesoscales in the climate
  system
Priority Level: High
Justification: 'Condition: for models with an ocean resolution of 1/4° of higher,
  and ocean parameterizations that allow mesoscale eddies to develop (weak or absent
  GM) Justification: Ocean models with a grid resolution of 1/4° or better represent
  the ocean mesoscale dynamics (instability of currents and eddies). Analyzing climate
  change in these models requires more variables, or variables at different frequencies,
  compared with non-eddying ocean models. Salt flux should be added but has no CMOR
  name (CF standard name: Ocean Salt X Transport). Daily 3D ocean state (uo, vo, thetao,
  so) should also be added to this group, but perhaps as time slices?'
Notes: ''

Name: DCPP_Wider
Title: A wider range of variables needed to understand the sources of prediction skill
  of DCPP hindcasts, and to better understand impacts of regional climate variability
  and change
Priority Level: Medium
Justification: These variables constitute a wider set of variables that will be used
  to better understand the predictability of a wider set of variables, including ocean
  biogeochemistry. They will also be used to better understand the processes shaping
  regional climate variability and change, and to understand the sources of predictable
  signals in the DCPP hindcasts. Specifically, the variables requested in DCPP_Wider
  extend on those in DCPP_Essential by asking for more 3D information, more high-frequency
  data, more process oriented diagnostic, more biogeochemistry diagnostics, and diagnostics
  that will be used to understand the impacts of extreme events.
Notes: ''

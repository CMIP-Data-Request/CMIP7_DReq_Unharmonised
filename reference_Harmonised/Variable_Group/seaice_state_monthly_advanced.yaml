Name: seaice_state_monthly_advanced
Title: Variables needed for process-based understanding of monthly basic state
Priority Level: Medium
Justification: This is a request for monthly resolution variables necessary to allow
  process understanding of the the state of the sea-ice cover, its spatial distribtution
  and temporal evolution, beyond what is available from the seaice_state_monthly_basic
  variable group.

Name: seaice_global_monthly_basic
Title: Integrated total hemispheric diagnostics
Priority Level: High
Justification: Very popular characterizations of sea ice are area, extent and volume,
  integrated over each hemisphere. Similarly, snow on sea ice can be characterised
  by its total mass. The diagnostics demanded here represent the best estimates from
  the modelling groups, expert of their model and the corresponding land masks and
  grids.

Name: urban_impacts_additional
Title: Additional variables to study impacts of climate variability and change on
  cities
Priority Level: Medium
Justification: 'This opportunity is focused on the impacts of climate variability
  and change on urban population and the built environment. With more than half the
  global population living in cities, and this number being projected to rapidly increase,
  this request is essential to support impacts assessments, adaptation strategies,
  and sustainable and resilient urban development amidst the challenges posed by a
  changing climate. The requested variables can support studies focused on understanding
  projected impacts to urban environments (both people and infrastructure). One manifestation
  of such impacts is the urban heat island, which requires detailed sub-daily variables
  to be modelled. Another strong impact of weather extremes on cities is given by
  surface flooding, which depends strongly on precipitation rates. Finally, some requested
  variable support studies into the urban PBL height, which modulates the impacts
  of air pollution. The additional temporal resolution will enable analyses of onset
  and development of events. A vast amount of literature supports the need for this
  data requirement and describes case studies. Some examples are listed below: https://www.frontiersin.org/journals/sustainable-cities/articles/10.3389/frsc.2021.645613/full
  https://royalsocietypublishing.org/doi/full/10.1098/rstb.2019.0124 https://www.sciencedirect.com/science/article/pii/S1352231021003745
  https://iopscience.iop.org/article/10.1088/1748-9326/acf94c/pdf https://www.mdpi.com/2225-1154/3/2/391
  https://www.sciencedirect.com/science/article/abs/pii/S0378778822008477 https://www.mdpi.com/2073-4441/16/3/474'
Notes: ''

Name: baseline_daily
Title: ESM Baseline Climate Variables
Priority Level: Core
Justification: ''
Notes: "As outlined in Baseline Climate Variables paper: https://doi.org/10.5194/egusphere-2024-2363\
  \ \n\nPlease note, the number of variables in this group is slightly lower (5 fewer\
  \ variables) than outlined in the paper. This is due to the harmonisation of pressure\
  \ levels that occured during the consultation process leading the following five\
  \ variables to be the same in the 'day' and 'Eday' CMIP6-era tables. Therefore the\
  \ Eday variants have been removed. \n1. day/Eday.hus\n2. day/Eday.ua\n3. day/Eday.va\n\
  4. day/Eday.zg\n5. day/Eday.ta"

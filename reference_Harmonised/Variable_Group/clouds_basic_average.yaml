Name: clouds_basic_average
Title: Time mean variables for evaluating clouds, radiation and precipitation
Priority Level: High
Justification: Simulating clouds with global climate models is challenging as the
  relevant physics involves many nonlinear processes covering a wide range of spatial
  and temporal scales. As key components of the hydrological cycle and the climate
  system, an evaluation of clouds from models used for climate projections is an important
  prerequisite for assessing the confidence in the results from these models. This
  variable group aims at supporting a quantitative evaluation of cloud parameters,
  radiation and precipitation of CMIP models. Combining the daily cycle of cloud properties
  with precipitation and radiation fields will allow for a more process-based analysis
  and improved understanding of biases in clouds.
Notes: ''

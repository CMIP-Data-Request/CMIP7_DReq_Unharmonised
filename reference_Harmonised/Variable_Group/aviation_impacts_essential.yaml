Name: aviation_impacts_essential
Title: Essential variables to study impacts of climate change on aviation
Priority Level: High
Justification: These variables were requested to support studies focused on the impacts
  of climate change on the aviation sector. Climate change causes changes on the jet
  streams that in turn affect wind shear and can cause clear air turbulence as shown
  in multiple studies (https://doi.org/10.1038/nclimate1866, https://doi.org/10.1007/978-3-319-23630-8_23,
  https://doi.org/10.1017/aer.2021.109). The variables in this group allow to diagnose
  clear air turbulence that is of relevance for passenger safety concerns as well
  as planning of flight routes and times.
Notes: ''
Variables:
- atmos.va.tpt-p5u-hxy-air.6hr.glb
- atmos.ta.tpt-p5u-hxy-u.6hr.glb
- atmos.ua.tpt-p5u-hxy-air.6hr.glb
Number of variables in group: 3

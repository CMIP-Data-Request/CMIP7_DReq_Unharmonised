Name: radiativeforcing_monthly
Title: Variables for diagnosing and decomposing radiative forcing at monthly timescales
Priority Level: High
Justification: This is a request for the minimum variables necessary to quantify radiative
  forcing and its components in CMIP simulations using standard diagnostic methods.
  This group is a subset of variables that can mostly be found in other, larger variable
  groups and thus has reduced computational burden.

Name: AgModelExpandedDaily
Title: Expanded daily climate drivers for agricultural modeling
Priority Level: High
Justification: This variable group contains a deeper set of variables needed for more
  complex agricultural modeling and impacts applications. The additional variables
  allow for better representation of drought stress, water requirements, and extreme
  impacts. Many of the top agricultural models (e.g., in the Agricultural Model Intercomparison
  and Improvement Project, AgMIP) have the ability to utilize this additional information
  along with more complex process representation and parameterizations within their
  models.

Name: AgWaterExt
Title: Agricultural water extended
Priority Level: Medium
Justification: These variables provide more extensive information to help agricultural
  modelers resolve water balances for agricultural fields, including soil pools, fluxes,
  and extreme conditions. This will help improve agricultural impacts and adaptation
  experts' ability to analyze drought, flooding, and water resource requirements.

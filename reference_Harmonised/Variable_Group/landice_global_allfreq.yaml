Name: landice_global_allfreq
Title: Variables for diagnosing ice sheet climate forcing and interactions
Priority Level: High
Justification: These are variables from Earth System Models requested by ISMIP7 in
  addition to baseline_fixed and baseline_monthly for creating forcings for standalone
  ice sheet model runs and for comparing behaviour with coupled ESM-ISMs. Summary
  ISMIP7 needs this set to create forcings for all the offline ice sheet models -
  RANKING MUST NOT BE CONSIDERED FOR THIS GROUP. It contains 46 single level surface
  variables at frequencies ranging from 6hrs to monthly
Notes: ''

Name: ocean_grid
Title: Ocean model grid information
Priority Level: High
Justification: The variables which provide information on the ocean model grid. This
  is useful for getting the most accurate computations on the different ocean model
  grid points (u, u, v and w). They are important when looking at ocean transects/sections
  and computing transports.

Name: landice_glaciers_allfreq
Title: Variable Set for Glacier Changes, Drivers, and Impacts Assessments
Priority Level: High
Justification: 'These variables are required for global glacier assessments which
  include polar and mountain glaciers, as identified in the Randolph Glacier Inventory
  (RGI). This variable group also supports the GlacierMIP activities and important
  for glacial mass balance computations. For details on use cases, please see the
  related opportunity: "ID 35 Glacier changes, drivers, and impacts." The variables
  required are at fixed, daily, and monthly temporal resolutions.'

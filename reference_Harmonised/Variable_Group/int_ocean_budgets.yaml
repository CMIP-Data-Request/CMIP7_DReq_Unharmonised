Name: int_ocean_budgets
Title: Vertically Integrated Ocean Energy and Salt Contents Monthly Mean Over Pressure
  Layers
Priority Level: High
Justification: These are fundamental to the earth's energy budget and hydrologic change,
  and due to new numerical schemes and vertical discretizations, it is important to
  calculate them consistently with the model formulation and equation of state. Also,
  observations occur at hydrostatic pressure levels and then are vertically-integrated
  and mapped, so this formulation allows for direct comparison to observations.

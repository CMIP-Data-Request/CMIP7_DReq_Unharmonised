Name: dynvar_basic
Title: High priority variables for atmospheric dynamics, transport and variability
Priority Level: High
Justification: This variable group is linked to the Atmospheric dynamics and variability
  opportunity, linked to DynVarMIP. It includes the minimum variables necessary to
  quantify the dynamics of the troposphere and stratosphere, in particular the momentum
  and thermodynamic balance components, using standard diagnostic methods. Variables
  of this group are widely used in publications to study atmospheric dynamics and
  transport processes including highly relevant phenomena like atmospheric blocking,
  Sudden Stratospheric Warmings or the stratospheric Brewer-Dobson circulation and
  how they are impacted by natural variability and human induced changes. The group
  includes mainly zonal mean fields and thus implies a reduced storage burden. Several
  of the variables are already in other more general variable groups.

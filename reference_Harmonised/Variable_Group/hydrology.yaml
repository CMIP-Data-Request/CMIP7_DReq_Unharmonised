Name: hydrology
Title: Hydrology and Freshwater Systems
Priority Level: Medium
Justification: These variables are requested for the hydrology and freshwater resources
  opportunity, aggregating information related to terrestrial water storage, lakes,
  rivers and estuaries, runoff, groundwater, permafrost, snow, and glaciers. These
  do not include other water cycle variables (e.g., precipitation or evaporation fluxes,
  etc.) covered in the baseline variables. Requested frequencies are mostly daily
  and monthly, with few fixed variables. Please see related opportunity description
  for use cases.

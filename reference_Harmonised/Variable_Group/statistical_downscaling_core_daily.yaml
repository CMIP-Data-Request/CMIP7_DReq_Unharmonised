Name: statistical_downscaling_core_daily
Title: Empirical Statistical Downscaling and Emulators (CORDEX) core daily
Priority Level: High
Justification: 'Core daily variables are used as large-scale fields for empirical
  statistical downscaling of climate projections (historical and scenario runs) which
  are typically at daily timescale and at multiple pressure levels. Only the following
  pressure levels are needed (hPa): 1000, 925, 850, 700, 500, 250, 200'
Notes: ''

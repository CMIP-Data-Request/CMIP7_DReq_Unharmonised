Name: global_emulators
Title: Training Emulators of the Global Climate Sytem
Priority Level: High
Justification: The requested variables will facilitate the creation of a family of
  foundation models to enable analysis of CMIP7 simulations using new Artificial Intelligence
  (AI) methods. AI is revolutionising approaches to the analysis of large an complex
  datasets and is likely to add huge value to the analysis of CMIP7. [WORK IN PROGRESS]

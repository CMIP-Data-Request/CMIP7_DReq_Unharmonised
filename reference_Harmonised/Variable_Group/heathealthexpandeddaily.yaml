Name: HeatHealthExpandedDaily
Title: Expanded daily climate drivers for heat health impacts
Priority Level: Medium
Justification: Variables in this group allow for more in-depth analysis of the health
  impacts of heat and cold. Additional variables allow for more complex heat-health
  indices (including humidity and radiation) and investigations of wind chill.

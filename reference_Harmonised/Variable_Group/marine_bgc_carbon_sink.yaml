Name: marine_bgc_carbon_sink
Title: Biological Carbon Pump Variables
Priority Level: Medium
Justification: Highlighted as a key process-based uncertainty in the marine carbon
  cycle (https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2023EF004375), that is
  largely uncharacterised within CMIP6 (https://doi.org/10.1073/pnas.2204369119),
  with potentially significant impact on ocean carbon sink over centennial timescales
  particularly w.r.t. net zero/net negative emissions (10.21203/rs.3.rs-3921898/v1)

Name: AgWaterCore
Title: Agricultural water core
Priority Level: High
Justification: These variables help agricultural modelers resolve water balances for
  agricultural fields, including soil pools, fluxes, and extreme conditions. This
  will help improve agricultural impacts and adaptation experts' ability to analyze
  drought, flooding, and water resource requirements.

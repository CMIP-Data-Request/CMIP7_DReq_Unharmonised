Name: aerchemmip_2d_daily
Title: 2D trace gas, aerosol and climate variables at daily timescales for use in
  AerChemMIP2
Priority Level: High
Justification: This request is for a set of 2D variables as daily means for use in
  AerChemMIP2. These variables cover atmospheric composition variables that are relevant
  to air quality (e.g., so2, co, different aerosol components, and PM) as well as
  relevant atmospheric and climate variables (e.g., wind speed, radiative fluxes,
  air temperature, precipitation) for understanding atmospheric composition and their
  impact on climate.

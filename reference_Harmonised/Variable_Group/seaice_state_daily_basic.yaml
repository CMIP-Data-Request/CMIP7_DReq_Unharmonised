Name: seaice_state_daily_basic
Title: Variables needed for assessment of sea ice changes at the sub-seasonal time
  scale
Priority Level: High
Justification: This is a request for daily resolution variables necessary to analyze
  the evolution of the sea ice characteristics at the sub-seasonal scale, such as
  the day of year when a certainty property is met during the seasonal development
  of the ice cover.

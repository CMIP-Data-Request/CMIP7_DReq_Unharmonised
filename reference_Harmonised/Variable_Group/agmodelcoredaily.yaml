Name: AgModelCoreDaily
Title: Core daily climate drivers for agricultural modeling
Priority Level: High
Justification: This group includes the core set of variables needed to run a typical
  process-based crop model. While some models require more variables or higher resolutions,
  this group will have the broadest application for agricultural models and other
  agricultural impacts applications.

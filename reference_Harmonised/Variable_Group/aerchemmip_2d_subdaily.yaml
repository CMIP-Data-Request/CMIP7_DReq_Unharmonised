Name: aerchemmip_2d_subdaily
Title: Surface and atmospheric fields at sub-daily timescales for analysis in AerChemMIP,
  including air quality and climate responses to SLCFs
Priority Level: High
Justification: This variable group is requesting a range of 2D variables at sub-daily
  timescales. Examples include variables at the surface that are relevant to air quality
  (e.g, ozone, particulate matter with a diameter less than 2.5 um, etc. ); Other
  variables are requested to understand aerosol extinction and backscatter, as well
  as variables to analyse climate responses due to changes in short-lived climate
  forcers (e.g, surface temperature).
Notes: ''

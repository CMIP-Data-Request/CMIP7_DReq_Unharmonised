Name: atmospheric_transports
Title: Variables needed to characterize energy and moisture transports
Priority Level: High
Justification: Atmospheric energy and moisture transports influence the evolution
  and characteristics of the sea ice pack and thus Polar Amplification. Evidence exists
  that the processes and feedbacks between the ice pack and the atmosphere that are
  central to Polar Amplification unfold at high frequency, which is why we request
  atmospheric transports at both the monthly and daily frequency.
Notes: ''

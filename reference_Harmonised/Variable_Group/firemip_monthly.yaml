Name: FireMIP_monthly
Title: FireMIP variables at monthly timeslices
Priority Level: High
Justification: '(1) Fire variables (burned area fraction and fire carbon emissions)
  will be utilized to: a) Analyze historical changes in fire patterns and project
  future scenarios under various climate and socio-economic conditions, informing
  long-term environmental planning and policy-making. b) Assess and improve fire simulations
  in coupled Earth System Models, leading to more accurate climate predictions and
  a deeper understanding of Earth''s complex systems. (2) A comprehensive set of variables
  including carbon, nitrogen, water, and energy cycles; vegetation distribution and
  structure; surface climate (e.g., temperature, precipitation, wind speed); atmospheric
  circulation, composition, and chemistry; sea surface temperature, sea water salinity
  and sea ice coverage will be analyzed to: a) Investigate the drivers behind changing
  fire regimes. b) Understand the underlying cross-sphere feedbacks between fire and
  various Earth system components.'
Notes: ''

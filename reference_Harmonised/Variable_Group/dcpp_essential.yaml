Name: DCPP_Essential
Title: Highest-priority variables needed to assess Earth System prediction skill using
  DCPP hindcasts
Priority Level: High
Justification: These variables constitute the highest priority variables needed for
  the baseline assessment of DCPP hindcasts. The variables largely focus on single
  level, monthly-mean fields, with a few higher frequency single-level fields. This
  request reflects the large number of simulated years needed to fulfill the core
  DCPP-A hindcasts set, and so DCPP_Essential is a balance between science needs and
  the disk space required to store all hindcast years.
Notes: ''

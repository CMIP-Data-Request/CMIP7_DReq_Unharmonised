Name: paleo_cryosphere_medium_priority
Title: Medium priority quantities of the cryosphere for paleoclimate research
Priority Level: Medium
Justification: Paleoclimate research necessitates specific variables that are not
  included in the baseline data request. Here we collect all variables that are relevant
  for improved understanding of the state of the cryosphere, with a focus on sea ice,
  across time scales.

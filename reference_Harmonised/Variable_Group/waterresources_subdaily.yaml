Name: WaterResources_subdaily
Title: Flood and drought risk assessment at subdaily timescale
Priority Level: Medium
Justification: Future projections of hydroclimatic hazards at regional scale are essential
  for assessing what adaptation actions and resilience building measures are needed
  to ensure water security. As some of these high-impact hazards such as flash flooding
  occur at very short timescale, ideally precipitation data could be supplied at hourly
  sampling frequency, and runoff and soil moisture data at 3-hourly.

Name: ref_atmosphere
Title: Variables that are needed for the atmospheric diagnostics planned in the Rapid
  Evaluation Framework (REF)
Priority Level: High
Justification: This is the set of variables that would be needed for the planned atmospheric
  diagnostics and metrics for the Rapid Evaluation Framework. The variable group will
  be linked with the "Rapid Evaluation Framework" opportunity, and is essential for
  evaluating the new AR7 fast track simulations on a routine basis.

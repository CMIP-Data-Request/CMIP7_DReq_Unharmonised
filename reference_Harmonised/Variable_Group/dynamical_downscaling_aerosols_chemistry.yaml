Name: dynamical_downscaling_aerosols_chemistry
Title: Dynamical Downscaling Aerosols and chemistry core (CORDEX)
Priority Level: High
Justification: Output from global climate models are needed to drive regional climate
  models at their lateral boundaries. Up to now, the variables needed were mainly
  limited to atmospheric variables (hus, ta, ua, va, ps) every 6 hours (6hrPlev) as
  well as some surface variables (tos, siconc...). However, new components of the
  climate system are now included in more and more regional models, such as aerosols
  and chemistry. Therefore, associated variables (such as aerosol concentrations)
  are also needed. The minimum would be to have all aerosol and chemistry species
  concentrations in monthly frequency in historical and scenario simulations. If possible,
  daily and average diurnal cycles would be helpful. The list of species depends on
  each GCM, for aerosols (mmr*), and for chemistry a few species are included explicitly
  (bry, cly, co, h2o2, hcl, hno3, n2o, noy, o3, oh, so2, ...) but this list is model-dependent.
  The diurnal cycle is important for chemistry variables which have a strong diurnal
  cycle.

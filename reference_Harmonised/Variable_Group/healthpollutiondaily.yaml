Name: HealthPollutionDaily
Title: Daily air pollution health impacts
Priority Level: High
Justification: Variables in this group allow health impacts and adaptation experts
  to track air pollution that are known to be hazardous to human health. Including
  these variables allows experts to track interactions between the climate system
  and pollutants that would not be available simply from emissions datasets.

  to run typical biodiversity models and model global biodiversity scenarios such
  as BES-SIM (Kim et al. 2018, DOI: https://doi.org/10.5194/gmd-11-4537-2018; Pereira
  et al. 2024, DOI: https://doi.org/10.1126/science.adn3441).'

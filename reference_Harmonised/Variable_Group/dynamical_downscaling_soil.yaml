Name: dynamical_downscaling_soil
Title: Dynamical Downscaling Soil (CORDEX)
Priority Level: Medium
Justification: Realistic atmospheric simulations on climate time scales require a
  coupled land surface model (LSM) to implicitly solve the heat and mass exchanges
  between the atmosphere and the land surface, including those involving vegetation,
  which are central to the hydrological cycle. The use of LSMs in regional climate
  simulations, in turn, requires high frequency 3D fields of soil temperature and
  moisture at specified soil depths, which ideally should be sourced from the same
  global climate simulations used to force the atmospheric model.

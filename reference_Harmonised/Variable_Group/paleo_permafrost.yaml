Name: paleo_permafrost
Title: permafrost and selected land-ice related variables for quantifying the state
  of the land-based cryosphere
Priority Level: High
Justification: The land and land ice author theme suggested to enable for opportunity
  ID 51 - Paleoclimate research across time scales - also the study of permafrost.
  This variable group collects the various variables that have been suggested by the
  community as relevant towards fulfilling this goal. The priority level of the whole
  variable group is graded as high priority towards enabling permafrost research in
  CMIP7, but higher frequency variables (daily resolution) are for more specific tasks
  (forcing for surface energy balance, offline permafrost, offline carbon/ecosystem,
  permafrost landscape models) and may be considered of lower priority than monthly
  mean variables that are an absolute necessity to diagnose and evaluate the state
  of permafrost. We also include land-ice related variables that will help to understand
  the state of ice sheets.

Name: SO_BGC-cloud_met_monthly
Title: Southern Ocean BGC-Cloud Meteorological Variables at monthly timeslices
Priority Level: High
Justification: Meteorological variables of interest to the Southern Ocean BGC to Clouds
  opportunity. We want to understand how natural aerosol interact with cloud and radiation
  and this cannot be fully understood without some knowledge of the background atmospheric
  state. We have requested atmospheric data required to disentangle meteorological
  influences on aerosol-cloud interactions, such as the large-scale dynamics that
  drive aerosol and moisture transport. These variables are a subset of those in the
  baseline request.

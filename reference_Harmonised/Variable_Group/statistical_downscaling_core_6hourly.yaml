Name: statistical_downscaling_core_6hourly
Title: Empirical Statistical Downscaling and Emulators (CORDEX) core 6hourly
Priority Level: Medium
Justification: 'Core 6-hourly variables are used as large-scale fields for empirical
  statistical downscaling of climate projections (historical and scenario runs) which
  are required for the increasingly demanded sub-daily timescale. At least the following
  pressure levels are needed (hPa): 1000, 925, 850, 700, 500, 250, 200 The variables
  are defined on different pressure levels that are needed (we couldn''t define new
  variables on different vertical coordinates, as there was a variable name conflict).'
Notes: ''

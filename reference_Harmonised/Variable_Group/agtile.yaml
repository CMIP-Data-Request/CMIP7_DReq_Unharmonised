Name: AgTile
Title: Agricultural tile
Priority Level: Low
Justification: The agricultural tiles within a larger grid cell may have a substantially
  different local climate than the full grid cell, which may lead to enhanced or reduced
  extreme conditions of high relevance for agricultural impacts applications. This
  variable group provides agricultural cell information to support such investigations.

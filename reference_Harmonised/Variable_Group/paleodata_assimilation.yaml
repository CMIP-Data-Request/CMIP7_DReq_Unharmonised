Name: paleodata_assimilation
Title: Variables needed to drive forward proxy system models and paleodata assimilation
  approaches
Priority Level: High
Justification: Reconstructions of past climates come a variety of different archives
  and methods. To better constrain the uncertainties in these reconstructions and
  compare them with climate models, it is advisable to devise a "forward proxy system
  model" that computes what a archive's record would look like if had seen the climate
  simulated by the model. These can then be used to create a reanalysis based all
  the available reconstructions and GCMs through paleodata assimilation.
Notes: ''

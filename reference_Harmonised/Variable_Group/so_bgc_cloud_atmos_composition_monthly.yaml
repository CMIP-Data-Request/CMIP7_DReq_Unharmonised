Name: SO_BGC-cloud_atmos_composition_monthly
Title: Southern Ocean BGC-Cloud Atmospheric Composition Variables at monthly timeslices
Priority Level: High
Justification: Atmospheric composition variables of interest to the Southern Ocean
  BGC to Clouds opportunity. We are interested in exploring the natural sources of
  aerosol from the Southern Ocean and Antarctic margins, and how they interact with
  clouds and radiation. Detailed aerosol properties, including number, size, and composition
  are critical for investigating the influence of different aerosol species on cloud
  formation, cloud phase, and precipitation processes, and ultimately how they interact
  with radiation. Simulated precursor gases (e.g. DMS) and other gas phase species
  are also important for isolating aerosol pathways that determine the aerosol composition
  and abundance.

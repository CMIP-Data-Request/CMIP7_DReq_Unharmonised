Name: seaice_global_daily_basic
Title: Characterizations of sea ice are area, extent and volume, integrated over each
  hemisphere, and reported daily. Similarly, snow on sea ice can be characterised
  by its total mass. The diagnostics demanded here represent the best estimates from
  the modelling groups, expert of their model and the corresponding land masks and
  grids.
Priority Level: Medium
Justification: Needed to assess changes in changes in seasonality (e.g., the day of
  year when a given volume of sea ice is passed)
Notes: ''

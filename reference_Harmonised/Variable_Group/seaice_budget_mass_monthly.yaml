Name: seaice_budget_mass_monthly
Title: Variables needed for assessing the sea ice mass budget at monthly timeslices
Priority Level: High
Justification: This is a request for monthly resolution variables necessary to analyze
  the evolution of the sea ice mass budget and quantify the physical cause and location
  of sea ice growth and melt, thus satisfying the requirements of the "Sea ice changes,
  drivers and impacts" opportunity.

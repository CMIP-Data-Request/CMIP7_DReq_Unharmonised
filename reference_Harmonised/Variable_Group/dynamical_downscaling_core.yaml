Name: dynamical_downscaling_core
Title: Dynamical Downscaling (CORDEX) core 6hourly
Priority Level: High
Justification: 'Downscaling is a key step in filling the gap between CMIP7 global
  climate model experiments and the activity of the communities dealing with vulnerability,
  impacts and adaptation studies. Dynamical downscaling requires 6-hourly 3D-global
  forcing fields for specific variables. Further details can be found, e.g., here:
  Giorgi, F. (2019). Thirty Years of Regional Climate Modeling: Where Are We and Where
  Are We Going next? Journal of Geophysical Research: Atmospheres, 124(11), 5696–5723.
  https://doi.org/10.1029/2018JD030094'
Notes: ''

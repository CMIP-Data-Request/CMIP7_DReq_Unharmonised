Name: WaterResourcesPET_monthly
Title: Additional Water Resources variables for calculating potential evapotranspiration
Priority Level: Medium
Justification: This is for the purpose of calculating potential evapotranspiration
  (PET) using Penman-Monteith equation, to be compared with the variable evspsblpot
  (the PET CMOR variable), and just in case if it cannot be provided given its very
  low rank in CMIP6, that it needs to be calculated from this extra set of variables.
Notes: ''

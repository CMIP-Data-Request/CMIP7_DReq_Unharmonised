Name: aerchemmip_fixed
Title: AerChemMIP Time-Invariant Variables
Priority Level: High
Justification: This group of variables contains time-invariant and fixed variables
  that will be required for analysis of CMIP7 simulations, including those included
  in AerChemMIP2. The request here is small and should be provided, when relevant,
  by all modelling centres. The variables AERfx.o3ref and/or AERfx.ch4ref are only
  relevant when the model includes diagnostic radiation calls for ozone and/or methane.
Notes: ''

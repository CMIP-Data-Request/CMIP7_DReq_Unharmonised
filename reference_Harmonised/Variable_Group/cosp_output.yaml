Name: cosp_output
Title: COSP output for evaluating clouds
Priority Level: High
Justification: Simulating clouds with global climate models is challenging as the
  relevant physics involves many nonlinear processes covering a wide range of spatial
  and temporal scales. As key components of the hydrological cycle and the climate
  system, an evaluation of clouds from models used for climate projections is an important
  prerequisite for assessing the confidence in the results from these models. So far,
  a quantitative evaluation of the representation of clouds in CMIP models with satellite
  observations has been challenging as only a limited number of parameters from a
  limited number of models has been available from satellite simulators. This variable
  group aims at supporting a quantitative evaluation of cloud parameters, radiation
  and precipitation using output from satellite simulators that has not been available
  in CMIP6.
Notes: ''

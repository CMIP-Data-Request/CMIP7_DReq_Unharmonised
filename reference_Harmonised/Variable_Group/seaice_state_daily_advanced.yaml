Name: seaice_state_daily_advanced
Title: Variables needed to assess the influence of processes related to high frequency
  variability on sea ice evolution and change
Priority Level: Medium
Justification: A daily version of the seaice_state_monthy_advanced in connection with
  another recommended variable group (seaice_budget_energy_daily, additional recommendation)
  is needed to assess the influence of atmospheric rivers, cyclones, and other forms
  of synoptic variability that have been shown to substantially influence sea ice
  evolution and are hypothesized to be tightly tied to feedbacks associated with Polar
  Amplification and the related inter-model spread.
Notes: ''

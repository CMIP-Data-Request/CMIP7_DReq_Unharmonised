Name: mixed_layer_extremes
Title: mixed_layer_extremes
Priority Level: High
Justification: Upper ocean dynamics are well-mixed vertically over the mixed layer.
  This means that the heat capacity and inertia of this layer are what responds to
  surface forcing, approximately. The depth of this layer is therefore critical for
  understanding the impacts of air-sea fluxes.
Notes: It is important to use 10m as the reference for temperature and density to
  calculate the mixed layer as a difference from that level.  http://dx.doi.org/10.5194/gmd-16-3849-2023

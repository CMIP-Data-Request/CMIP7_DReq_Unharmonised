Name: landuse
Title: Land use information including land use fractions and subgrid output on land
  use tiles at monthly and yearly timescales
Priority Level: Medium
Justification: Set of variables to track land use area fractions and subgrid fluxes
  and states on land use tiles. The requested variables enable tracking of what models
  use and/or simulate in terms of land use and land cover types. The requested variables
  also enable tracking of carbon fluxes and states on subgrid land use tiles as well
  as selected biogeophysical quantities on subgrid tiles to evaluate the carbon and
  near-surface climate impacts of land use change.

Name: dynamical_downscaling_ocean_core
Title: Dynamical Downscaling Ocean (CORDEX) core
Priority Level: High
Justification: There is an emerging need for regional downscaling of global climate
  models for the ocean (physics, biogeochemistry, sea ice) to provide refined and
  more regional-to-local information on marine environment past and projections changes,
  to support ocean climate services and for climate adaptation. A set of variables
  are needed to force regional ocean models at their lateral boundaries, and at the
  air-sea interface for forced models. Omon.tos is requested here, but already covered
  by the variable group dynamical_downscaling_core (by Oday.tos), in case this is
  also stored.
Notes: ''

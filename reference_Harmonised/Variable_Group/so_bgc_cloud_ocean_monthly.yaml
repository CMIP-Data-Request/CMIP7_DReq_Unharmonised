Name: SO_BGC-cloud_ocean_monthly
Title: Southern Ocean BGC-Cloud Ocean Variables at monthly timeslices
Priority Level: High
Justification: Physical ocean and sea ice variables of interest to the Southern Ocean
  BGC to Clouds opportunity. We want to understand how natural aerosol interact with
  cloud and radiation. Because of the nature of these aerosol, which are produced
  by physical processes (eg. waves) and biogeochemical processes (eg. primary productivity),
  this cannot be fully understood without some knowledge of the background oceanic
  and sea ice state. This variable group is a subset of the baseline monthly variables.

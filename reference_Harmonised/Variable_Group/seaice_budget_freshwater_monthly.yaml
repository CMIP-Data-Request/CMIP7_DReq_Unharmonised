Name: seaice_budget_freshwater_monthly
Title: Variables needed for assessing the sea ice freshwater budget at monthly timeslices
Priority Level: Medium
Justification: This is a request for monthly resolution variables necessary to analyze
  the evolution of the sea ice freshwater budget and understand the interaction of
  sea ice with the hydrological cycle of the Earth, thus satisfying the requirements
  of the "Sea ice changes, drivers and impacts" opportunity.

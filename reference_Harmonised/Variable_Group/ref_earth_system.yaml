Name: ref_earth_system
Title: Variables that are needed for the earth system diagnostics planned for the
  Rapid Evaluation Framework (REF)
Priority Level: High
Justification: This is the set of variables that would be needed for the planned earth
  system diagnostics and metrics for the Rapid Evaluation Framework. The variable

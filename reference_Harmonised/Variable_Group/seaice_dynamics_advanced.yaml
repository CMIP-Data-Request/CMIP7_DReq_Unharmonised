Name: seaice_dynamics_advanced
Title: Variables needed for a detailed assessment of sea ice dynamics
Priority Level: Medium
Justification: 'Sea ice drifts, which has implications on sea ice and how it changes.
  To understand sea ice drift and its implications, we propose here following Notz
  et al (2016) three categories of variables: 1) horizontal sea ice + snow mass transport
  terms, 2) terms of the sea ice horizontal momentum budget, 3) invariants of the
  stress and strain rate tensors.'
Notes: ''

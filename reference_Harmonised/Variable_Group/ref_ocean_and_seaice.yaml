Name: ref_ocean_and_seaice
Title: Variables that are needed for the ocean and sea ice diagnostics planned for
  the Rapid Evaluation Framework (REF)
Priority Level: High
Justification: This is the set of variables that would be needed for the planned ocean
  and sea ice diagnostics and metrics for the Rapid Evaluation Framework. The variable
  group will be linked with the "Rapid Evaluation Framework" opportunity, and is essential
  for the evaluation of the new AR7 fast track simulations on a routine basis.

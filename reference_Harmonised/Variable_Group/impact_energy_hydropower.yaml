Name: impact_energy_hydropower
Title: Impacts and Adaptation, Energy – minimal variables for hydropower modelling
Priority Level: High
Justification: Many energy systems around the world are heavily dominated by hydropower
  for electricity production (storage and run-of-river). This is a minimal set of
  variables designed to model the availability of hydropower in energy system models.

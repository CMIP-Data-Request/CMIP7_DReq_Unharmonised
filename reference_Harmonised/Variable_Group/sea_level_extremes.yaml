Name: sea_level_extremes
Title: High-frequency surface variability
Priority Level: High
Justification: This product is important for impacts, ice sheet forcing, and coastal
  impacts. It is critically different between eddy-permitting and coarse-resolution
  models, which should be part of the sea level assessment (AR6 Fig. 9.12).

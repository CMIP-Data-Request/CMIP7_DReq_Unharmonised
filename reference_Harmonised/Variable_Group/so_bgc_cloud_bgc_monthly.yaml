Name: SO_BGC-cloud_BGC_monthly
Title: Southern Ocean BGC-Cloud BGC Variables at monthly timeslices
Priority Level: High
Justification: Biogeochemical variables of interest to the Southern Ocean BGC to Clouds
  opportunity. We are interested in exploring the natural sources of aerosol from
  the Southern Ocean and Antarctic margins, and how they interact with clouds and
  radiation. Information about the oceanic biogeochemistry is important for understanding
  the sources of natural aerosol, such as dimethyl sulfide and primary marine organics;
  to understand how biogeochemistry influences and is influenced by atmospheric, sea
  ice and oceanic conditions and to test relationships and potential offline parameterisations
  for future model development.

Name: seaice_budget_energy_monthly
Title: Variables needed for assessing the sea ice energy budget at monthly timeslices
Priority Level: High
Justification: This is a request for monthly resolution variables necessary to analyze
  the evolution of the sea ice energy budget and understand the drivers of sea ice
  mass tendencies, thus satisfying the requirements of the "Sea ice changes, drivers
  and impacts" opportunity.
Notes: This variable group includes heat fluxes relevant to sea ice both from the
  sea ice and the atmospheric components. This is because, depending on the model,
  the full decomposition of the different fluxes might be available only in one component
  or the others, so to make sure all the terms to close the sea ice energy budget
  are present we request them in both components.

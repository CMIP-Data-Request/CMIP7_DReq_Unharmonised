Name: DAMIP_monthly
Title: Monthly variables of high priority for DAMIP
Priority Level: High
Justification: 'The proposed set of monthly variables are considered high priority
  for DAMIP to assess changes in the climate system and the role of forcings in driving
  those changes. - Basic fields for assessing global mean temperature, hydrological,
  sea level, and circulation changes: tas, ts, tos, pr, ps, prsn, psl, mrsos, mrros,
  tauu, tauv, evspsbl, mrro, uas, vas, huss, hurs, ta, ua, va, wap, zos, zostoga,
  siconc, siconca, sithick, snw, sfcWind - Fluxes for diagnosing surface and top of
  atmosphere energy balances: hfls, hflss, rlds, rlus, rsds, rsus, rsdt, rsut, rtmt
  - Quantities for understanding the role of clouds: rsdsc, rsusc, clt, clwvi, clivi
  - Quantities for diagnosing the change in ocean circulation e.g., examples of the
  use of DAMIP in analyzing ocean circulation behavior is Menary et al (2020) 10.1029/2020GL088166
  and Simpson et al (2023) 10.1175/JCLI-D-22-0666.s1 : hfbasin, msftmrho, msftmz,
  so, thetao, uo, vo - Quantities for understanding differences in co2 concentrations
  from emissions driven simulations: co2, fgco2, nbp - Quantities for diagnosing the
  various forcings that the climate system is being influenced by: loadso4, abs550aer,
  abs550bc, abs550so4, od550aer, od550soa, od550dust, od550volso4, o3ste, tropo3ste
  - Zonal mean atmospheric temperature at high vertical resolution (AERmonZ.ta) but
  3D would also work. There''s a desire to have atmospheric temperature with higher
  vertical resolution at upper levels to better capturing stratospheric satellite
  weighting functions.'
Notes: ''

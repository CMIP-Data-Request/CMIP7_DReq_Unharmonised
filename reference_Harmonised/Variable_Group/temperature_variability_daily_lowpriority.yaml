Name: temperature_variability_daily_lowpriority
Title: Lower priority (but still desirable) daily average variables that are useful
  for quantifying daily temperature variability and the processes involved.
Priority Level: Medium
Justification: 'This group of variables consists of those that are required to both
  quantify daily temperature variability and to understand the processes involves.
  This group contains the lower priority variables for this opportunity: - daily surface
  temperature, which can be useful for understanding the behavior of sensible heat
  flux when paired with daily surface air temperature. - daily temperature. This is
  useful for diagnosing mid-tropospheric moist static energy which has been used to
  develop theories for surface temperature variability and the upper bounds of temperature
  extremes e.g., Zhang and Boos (2023, 10.1073/pnas.2215278120), Byrne (2021, 10.1038/s41561-021-00828-8)
  and for diagnosing temperature advection. 500 hPa and 850 hPa would be the most
  relevant levels. - daily zonal and meridional winds on pressure levels. Useful for
  diagnosing temperature advection. 850 hPa would be the most relevant levels. - daily
  hus. This is also useful for diagnosing moist static energy which has been used
  in theories of temperature variability and extremes. Note that zg is also needed
  for that but it is specified in the higher priority variable group. - Potential
  evapotranspiration (evspsblpot) - useful for quantifying aridity. - Relative humidity
  which is useful for fire weather indices and for quantifying dryness. - Runoff variables
  mrro and mrros which would be useful for understanding soil moisture evolution given
  soil moistures important control on temperature extremes - Daily precipitation which
  is also useful for understanding the evolution of soil moisture. - Daily surface
  pressure which is useful for calculating vapor pressure deficit. - Daily sea level
  pressure which is useful for examining the circulation anomalies associated with
  temperature variability - Clear sky surface longwave and shortwave downward fluxes
  which can be paired with the higher priority all sky equivalents to examine the
  impact of clouds on the surface energy balance. - Daily surface wind speed which
  could be used to understand the behavior of surface and latent heat fluxes (which
  modulate temperature variability) - Daily minimum and maximum boundary layer height
  which can be used to diagnose how the boundary layer is behaving within temperature
  extremes.'

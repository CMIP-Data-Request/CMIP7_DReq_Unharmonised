Title: Constructing a Global Carbon Budget
Description: This data is needed to construct a closed global carbon budget, and relating
  emissions to CO2 concentrations
Expected Impacts: In Concentration-driven experiments, this is needed to infer CO2
  emissions and quantify feedbacks. In CO2 emissions-driven experiments, this is needed
  to trace carbon flows and understand the partitioning of emissions into different
  land, ocean, and atmosphere pools
Justification of Resources: This is needed to understand the relationship between
  CO2 emissions and concentrations, which is fundamental to the concept of an Earth
  System Model and a variety of global change problems.

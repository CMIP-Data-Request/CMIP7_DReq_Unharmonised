Title: Benchmarking and Attributing Changes to Global Carbon and other Biogeochemical
  Cycles
Description: These variables are needed to benchmark, understand, and attribute changes
  to the global carbon cycle, as well as other biogeochemical cycles on land and ocean.
Expected Impacts: Understanding changes to carbon sinks across global change scenarios,
  and benchmarking the fidelity of land and ocean biogeochemical components of ESMs,
  is needed to understand the relationship between CO2 emissions, CO2 concentrations,
  global climate change, and other biogeochemical cycles, across historical, future,
  and idealized scenarios.
Justification of Resources: The coupling of carbon and climate as enabled through
  Earth system models requires benchmarking the fidelity of carbon and other biogeochemical
  cycles, and attributing changes in carbon sinks to forcings and feedbacks in the
  Earth system.
